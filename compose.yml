services:
  floci:
    image: floci/floci:2.0.1-compat
    env_file:
      - ./config/aws.env
      - ./config/floci.env
    volumes:
      - ./scripts/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:4566/_floci/init | grep -q '\"ready\":true'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.28
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "27017:27017"

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - ./config/mssql.env
    healthcheck:
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  servicebus-emulator:
    image: servicebus-emulator-with-curl:latest
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/aspnet:8.0.3-cbl-mariner2.0-amd64 AS base
        FROM mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        COPY --from=base /usr/bin/curl /usr/bin/curl
        COPY --from=base /usr/lib /usr/lib
        COPY --from=base /bin/sh /bin/sh
    env_file:
      - ./config/servicebus-emulator.env
    volumes:
      - ./config/servicebus-emulator.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5300/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "5672:5672"
      - "5300:5300"

  wiremock:
    environment:
      TZ: Europe/London
    image: sheyenrath/wiremock.net:latest
    ports:
      - "9090:80"

  trade-imports-gmr-finder:
    image: defradigital/trade-imports-gmr-finder:${TRADE_IMPORTS_GMR_FINDER:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-gmr-finder.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3000:8080"

  trade-imports-gmr-processor:
    image: defradigital/trade-imports-gmr-processor:${TRADE_IMPORTS_GMR_PROCESSOR:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-gmr-processor.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3001:8080"
