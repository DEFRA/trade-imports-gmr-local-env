services:
  floci:
    image: floci/floci:1.5.25-compat
    env_file:
      - ./config/aws.env
      - ./config/floci.env
    volumes:
      - ./scripts/floci:/etc/floci/init/ready.d
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.28
    volumes:
      - ./scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3

  mssql:
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=secretPassword!
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      timeout: 5s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=secretPassword!
      - SQL_SERVER=mssql
      - SQL_WAIT_INTERVAL=0
    volumes:
      - ./config/servicebus-emulator.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "5672:5672"
      - "5300:5300"

  wiremock:
    environment:
      TZ: Europe/London
    image: sheyenrath/wiremock.net:latest
    ports:
      - "9090:80"

  trade-imports-gmr-finder:
    image: defradigital/trade-imports-gmr-finder:${TRADE_IMPORTS_GMR_FINDER:-latest}
    env_file:
      - ./config/defaults.env
      - ./config/aws.env
      - ./config/trade-imports-gmr-finder.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3000:8080"

  trade-imports-gmr-processor:
    image: defradigital/trade-imports-gmr-processor:${TRADE_IMPORTS_GMR_PROCESSOR:-latest}
    env_file:
      - ./config/defaults.env
      - ./config/aws.env
      - ./config/trade-imports-gmr-processor.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3001:8080"
