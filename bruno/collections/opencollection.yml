opencollection: 1.0.0

info:
  name: trade-imports-gmr
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: x-api-key
      value: "{{cdp_developer_api_key}}"
  auth:
    type: basic
    username: "{{basic_auth_username}}"
    password: "{{basic_auth_password}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
